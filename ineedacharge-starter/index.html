<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INeedaCharge</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>INeedaCharge</h1>
    <p>Get a mobile EV charge wherever you are.</p>
  </header>
  <main>
    <form id="chargeRequestForm">
      <label for="email">Email:</label>
      <input type="email" id="email" required/>

      <label for="location">Location:</label>
      <input type="text" id="location" required/>

      <label for="car">EV Model:</label>
      <input type="text" id="car" required/>

      <button type="submit">Request a Charge</button>
    </form>

    <div class="auth">
      <button id="googleSignIn">Sign in with Google (coming soon)</button>
    </div>

    <div class="payment">
      <button id="payNow">Pay with Apple Pay / Card (coming soon)</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
